[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-triage-ai"
version = "0.1.0"
description = "Medical Triage AI using Logistic Regression"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.24.0",
    "gradio>=4.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "openenv-core>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
# Run server easily
server = "server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["server"]